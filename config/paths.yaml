# Default paths. Copy to paths.local.yaml (gitignored) to override
# per-machine without dirtying the repo.
rfdiffusion_root: /mnt/src/RFdiffusion
python_bin: /mnt/src/rfdiff-venv/bin/python
models_dir: /mnt/src/models
results_dir: results
inputs_dir: data/inputs

# execution backend: "local" now, "remote" when you rent a GPU
backend: local

# GPU is the intended target. A run aborts if this is "cuda" and no GPU is
# visible, rather than silently falling back and taking 50-100x longer.
# CPU-only hosts must opt in explicitly in paths.local.yaml:  device: cpu
device: cuda
